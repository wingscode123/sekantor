<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ronda social preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;800&display=swap">
<link rel="stylesheet" href="social.css"></head>
<body class="sp">
  <div class="sp__text">
    <img src="../logo/lockup-on-dark.svg" width="242" height="60" alt="Ronda">
    <h1>Your agents work all night. Ronda keeps watch.</h1>
    <p>One local inbox for every coding agent.</p>
  </div>
  <div class="sp__visual">
    <div class="inbox">
      <p class="inbox__group">Needs you <span class="num">1</span></p>
      <article class="card card--lit">
        <div class="card__head"><span class="card__source">Claude Code</span><span class="card__host">in Orca</span><span class="card__time">4m</span></div>
        <p class="card__msg"><span class="status status--approval">Wants to run</span> <code>docker compose up -d</code></p>
        <div class="card__actions"><span class="ctl ctl--go">Approve</span><span class="ctl">Deny</span></div>
      </article>
      <p class="inbox__group">Running <span class="num">2</span></p>
      <ul class="rows">
        <li class="row"><span class="status status--running">Running</span><span>Codex in tmux</span><code class="row__where">example-docs</code><span class="card__time">2m</span></li>
        <li class="row"><span class="status status--running">Running</span><span>Claude in VS Code</span><code class="row__where">example-shop</code><span class="card__time">40s</span></li>
      </ul>
    </div>
  </div>
</body></html>
