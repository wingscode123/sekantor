name: desktop

# Tests plus the unsigned Windows installer (PyInstaller folder + native hook + Tauri shell -> NSIS).
# A port of the CircleCI desktop-windows job. Runs on pushes to main and desktop-*/gha-* branches,
# and by hand (Actions tab -> desktop -> Run workflow, once this file is on the default branch).

on:
  push:
    branches: [main, "desktop-*", "gha-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Order matters: tauri-build (also run by `cargo test`) needs the generated icons and dist/sekantor/.
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal && rustup default stable && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hook
            desktop/src-tauri

      - name: Build the web UI
        run: |
          set -euxo pipefail
          mkdir -p logs
          cd web && npm ci && npm run build

      - name: PyInstaller (dist/sekantor)
        run: |
          set -euxo pipefail
          uv sync --locked --group packaging
          uv run pyinstaller packaging/sekantor.spec --distpath dist --workpath build/pyi --noconfirm 2>&1 | tee logs/pyinstaller.log

      - name: Native hook (cargo test, release build into dist/sekantor)
        run: |
          set -euxo pipefail
          cd hook
          cargo test 2>&1 | tee ../logs/hook-cargo-test.log
          cargo build --release 2>&1 | tee ../logs/hook-cargo-build.log
          cp target/release/sekantor-hook.exe ../dist/sekantor/
          ls -l ../dist/sekantor/sekantor-hook.exe

      - name: Smoke test the PyInstaller folder
        run: SMOKE_LOG_DIR=logs uv run python packaging/smoke.py dist/sekantor --port 7899 --service

      - name: Generate icons
        run: |
          set -euxo pipefail
          cd desktop && npm ci && npm run icons

      - name: cargo test (desktop)
        run: |
          set -euxo pipefail
          cd desktop/src-tauri
          cargo test 2>&1 | tee ../../logs/cargo-test.log

      - name: Build the installer (tauri build)
        run: |
          set -euxo pipefail
          cd desktop
          rm -rf src-tauri/target/release/bundle   # only this build's installer gets uploaded
          npx tauri build 2>&1 | tee ../logs/tauri-build.log
          mkdir -p ../installer
          cp src-tauri/target/release/bundle/nsis/*.exe ../installer/
          ls -l ../installer

      - name: Install, first run and uninstall the installer
        run: uv run python packaging/installer_check.py "installer/SeKantor_*-setup.exe" 2>&1 | tee logs/installer-check.log

      - uses: actions/upload-artifact@v4
        with:
          name: sekantor-windows-installer
          path: installer/
          if-no-files-found: error

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          cp desktop/src-tauri/Cargo.lock logs/ 2>/dev/null || true
          cp hook/Cargo.lock logs/hook-Cargo.lock 2>/dev/null || true
          cp -r build/pyi/sekantor/warn-*.txt logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
