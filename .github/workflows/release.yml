name: release

# Push a tag like v0.2.0. Builds the web UI into the package, then the wheel and sdist, and attaches
# them to a GitHub Release. Publishing to PyPI runs only when the repository variable
# PUBLISH_PYPI is "true" and PyPI trusted publishing is set up (docs/release.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Version matches the tag
        run: |
          v=$(uv version --short)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "pyproject version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - run: uv build
      - name: The wheel carries the web UI and the rules
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in ("ronda/hub/static/index.html", "ronda/hosts.yaml", "ronda/pos/tmux/agents.yaml"):
              assert need in names, need
          print("ok", len(names), "files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
