[package]
name = "sekantor-desktop"
version = "0.1.0"
description = "SeKantor desktop shell: tray, first run, and a window on the local hub"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to 127.0.0.1 only: no TLS, no proxy.
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
