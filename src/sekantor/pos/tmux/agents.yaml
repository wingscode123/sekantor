# tmux pos: how to recognise a CLI agent's state from its screen (FR-04, FR-23).
#
# Patterns are regular expressions (case-insensitive) matched against the last `tail` lines of the
# pane. They are UNVERIFIED best guesses until someone captures each agent's real prompts: send a
# fix with `tmux capture-pane -p` output. `approve_keys` / `deny_keys` are tmux key names sent with
# `send-keys` (Enter, Escape, y, n, 1, ...). An agent without them gets no Approve/Deny buttons.

version: 1
idle_s: 4          # screen unchanged this long = the agent waits for input
tail: 15

defaults:
  approval:
    - '\((y/n|yes/no)\)'
    - '\[(y/N|Y/n|y/n)\]'
    - '\b(do you want to|would you like to) (proceed|run|continue|apply|allow)'
    - '\ballow (this|the) (command|tool|edit|change)'
  approve_keys: ["y", "Enter"]
  deny_keys: ["n", "Enter"]
  prompt:
    - '^\s*(>|❯|›|»)\s*$'

agents:
  claude:
    skip: true      # Claude Code reports through its hooks; set false to watch it here too
  codex: {}
  opencode: {}
  gemini: {}
  aider:
    prompt:
      - '^\s*(aider|architect|ask|code)?\s*>\s*$'
