# Ronda host fingerprint rules (FR-08 / FR-09), schema version 1.
#
# A "host" is the app an agent process runs inside (Orca, VS Code, Claude desktop, ...).
# Each rule lists signals. A signal that matches contributes its weight; confidence is
#   1 - product(1 - weight) over matched signals
# so independent weak signals add up but never exceed 1. The host with the highest
# confidence wins (ties: earlier in this file wins). Below `min_confidence` the host is
# "terminal" when there is terminal evidence, else no host. Display names live in src/ronda/labels.py.
#
# Signal kinds (all optional, all case-insensitive):
#   env:          name of an env var on the agent process / hook
#     equals:     exact value      matches: regex on the value      (neither: var is set and non-empty)
#   parent:       regex on the name of any process in the parent chain (closest 8)
#   exe:          regex on the agent executable path (forward slashes)
#   cwd:          regex on the working directory (forward slashes)
#   cmdline:      regex on the agent command line joined with spaces
#
# `via` in the event schema is the list of signal ids that matched, shown in the UI.
# `verified` = seen in real evidence (docs/spike/evidence, docs/spike/payloads). Unverified
# rules are best guesses for other OSes; please send a probe (scripts/probe_hosts.py) to fix them.

version: 1
min_confidence: 0.5

hosts:
  - id: orca
    verified: [windows]
    signals:
      - {id: env_orca_session, env: ORCA_AGENT_SESSION_ID, weight: 0.9}       # Orca chat (SDK) sessions
      - {id: env_orca_pane, env: ORCA_AGENT_PANE, weight: 0.9}                # claude run in an Orca terminal
      - {id: term_program, env: TERM_PROGRAM, equals: Orca, weight: 0.8}
      - {id: env_orca_app, env: ORCA_APP_VERSION, weight: 0.6}
      - {id: process_tree, parent: '^orca(\.exe)?$', weight: 0.7}

  - id: openbot
    verified: [windows]
    signals:
      - {id: env_openbot, env: OPENBOT_AGENT_PROCESS, equals: "1", weight: 0.9}
      - {id: entrypoint, env: CLAUDE_CODE_ENTRYPOINT, equals: openbot, weight: 0.9}
      - {id: sdk_client, env: CLAUDE_AGENT_SDK_CLIENT_APP, matches: '^openbot/', weight: 0.8}
      - {id: process_tree, parent: '^openbot(\.exe)?$', weight: 0.7}
      - {id: cwd, cwd: '/OpenBot/Agents/agent-[0-9a-f-]+', weight: 0.5}
      - {id: exe, exe: '/OpenBot/provider-runtimes/', weight: 0.6}

  - id: claude-desktop
    verified: [windows]
    signals:
      - {id: entrypoint, env: CLAUDE_CODE_ENTRYPOINT, equals: claude-desktop, weight: 0.95}
      - {id: env_desktop_version, env: CLAUDE_CODE_DESKTOP_APP_VERSION, weight: 0.8}
      # Windows: %APPDATA%/Claude/claude-code/<ver>/<hash>/claude.exe ; macOS: ~/Library/Application Support/Claude/claude-code/...
      - {id: exe, exe: '/Claude/claude-code/[0-9.]+/', weight: 0.6}

  - id: cursor
    verified: []
    signals:
      - {id: env_cursor, env: CURSOR_TRACE_ID, weight: 0.8}
      - {id: process_tree, parent: '^cursor(\.exe)?$', weight: 0.8}
      - {id: exe, exe: '/cursor/extensions/anthropic\.claude-code-', weight: 0.6}

  - id: vscode
    verified: [windows]
    signals:
      - {id: entrypoint, env: CLAUDE_CODE_ENTRYPOINT, equals: claude-vscode, weight: 0.8}  # extension panel (Cursor may share it)
      - {id: term_program, env: TERM_PROGRAM, equals: vscode, weight: 0.7}               # integrated terminal
      - {id: env_vscode_pid, env: VSCODE_PID, weight: 0.6}
      - {id: process_tree, parent: '^(code|code - insiders|electron)(\.exe)?$', weight: 0.6}
      - {id: exe, exe: '/\.vscode(-insiders)?/extensions/anthropic\.claude-code-', weight: 0.6}

  - id: jetbrains
    verified: []
    signals:
      - {id: terminal_emulator, env: TERMINAL_EMULATOR, matches: '^JetBrains', weight: 0.8}
      - {id: process_tree, parent: '^(idea|pycharm|webstorm|goland|clion|rider|phpstorm|rubymine)(64)?(\.exe)?$', weight: 0.7}

  - id: tmux
    verified: []
    signals:
      - {id: env_tmux, env: TMUX, weight: 0.9}
      - {id: env_tmux_pane, env: TMUX_PANE, weight: 0.5}
      - {id: process_tree, parent: '^tmux', weight: 0.7}

  - id: windows-terminal
    verified: []
    signals:
      - {id: env_wt, env: WT_SESSION, weight: 0.8}
      - {id: process_tree, parent: '^windowsterminal(\.exe)?$', weight: 0.7}

  - id: iterm
    verified: []
    signals:
      - {id: term_program, env: TERM_PROGRAM, equals: iTerm.app, weight: 0.8}
      - {id: env_iterm, env: ITERM_SESSION_ID, weight: 0.6}

  - id: apple-terminal
    verified: []
    signals:
      - {id: term_program, env: TERM_PROGRAM, equals: Apple_Terminal, weight: 0.8}

  - id: wezterm
    verified: []
    signals:
      - {id: term_program, env: TERM_PROGRAM, equals: WezTerm, weight: 0.8}
      - {id: env_wezterm, env: WEZTERM_PANE, weight: 0.6}

  - id: ghostty
    verified: []
    signals:
      - {id: term_program, env: TERM_PROGRAM, equals: ghostty, weight: 0.8}
      - {id: env_ghostty, env: GHOSTTY_RESOURCES_DIR, weight: 0.5}

  - id: kitty
    verified: []
    signals:
      - {id: env_kitty, env: KITTY_WINDOW_ID, weight: 0.8}

# Fallback when nothing above reaches min_confidence but the agent has a TTY-ish parent.
fallback:
  terminal:
    signals:
      - {id: shell_parent, parent: '^(bash|zsh|fish|sh|pwsh|powershell|cmd|nu)(\.exe)?$', weight: 0.5}
      - {id: env_term, env: TERM, weight: 0.2}
